name: FFmpeg AAR arm64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'status/**'
      - '**.md'

env:
  NDK_VERSION: 27.3.13750724
  FFMPEG_KIT_TAG: v9.0.2

jobs:
  marca:
    name: marca
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Marcar build en curso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mio=${{ github.run_id }}
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset --hard -q origin/main
            if [ -f status/latest.json ]; then
              otro=$(sed -n 's/.*"run":"\([0-9]*\)".*/\1/p' status/latest.json)
              if [ -n "$otro" ] && [ "$otro" -gt "$mio" ]; then
                echo "Estado ya pertenece al run $otro (posterior). No se sobrescribe."
                exit 0
              fi
            fi
            mkdir -p status
            printf '{"resultado":"en_curso","run":"%s","fecha":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > status/latest.json
            git add status/latest.json
            git commit -m "estado: en curso [skip ci]" || true
            git push && break
            sleep 3
          done

  build:
    name: ${{ matrix.nombre }}
    needs: [marca]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: full-32-64
            flags: "--enable-gpl --enable-lib-x264 --enable-lib-x265 --enable-lib-libvpx --enable-lib-libaom --enable-lib-dav1d --enable-lib-libsvtav1 --enable-lib-opus --enable-lib-lame --enable-lib-libvorbis --enable-lib-libtheora --enable-lib-libass --enable-lib-freetype --enable-lib-fontconfig --enable-lib-fribidi --enable-lib-harfbuzz --enable-lib-srt --enable-lib-zimg --enable-lib-libwebp --enable-lib-libvidstab --enable-lib-openssl --enable-lib-libxml2"
            archs: "--disable-arch-x86 --disable-arch-x86-64"
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Código de ffmpeg-kit-next
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: ${{ env.FFMPEG_KIT_TAG }}
          path: src

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android, NDK r27d y herramientas
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then CMDLINE="$SDK_ROOT/cmdline-tools/16.0/bin"; fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config nasm gperf \
            meson ninja-build cmake autogen groff gettext autopoint bison flex texinfo gawk python3-setuptools \
            gtk-doc-tools libglib2.0-dev libxml2-dev libtasn1-bin libtasn1-6-dev
          df -h / | tail -1

      - name: Predescargar Gradle
        run: |
          set -euo pipefail
          props=$(find src -name gradle-wrapper.properties | head -1)
          if [ -z "$props" ]; then echo "sin wrapper, nada que hacer"; exit 0; fi
          url=$(grep '^distributionUrl=' "$props" | sed 's/^distributionUrl=//' | sed 's|\\:|:|g')
          zip="/tmp/$(basename "$url")"
          echo "Distribucion: $url"
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$zip" "$url"; then ok=1; break; fi
            echo "reintento $i"; sleep 15
          done
          if [ "$ok" != "1" ]; then echo "no se pudo descargar gradle"; exit 1; fi
          ls -la "$zip"
          for f in $(find src -name gradle-wrapper.properties); do
            sed -i "s|^distributionUrl=.*|distributionUrl=file\\://$zip|" "$f"
            grep -q '^networkTimeout=' "$f" || echo 'networkTimeout=120000' >> "$f"
            sed -i 's|^networkTimeout=.*|networkTimeout=120000|' "$f"
          done
          grep -h -E 'distributionUrl|networkTimeout' $(find src -name gradle-wrapper.properties) || true
          # Reintentos de red: Maven Central redirige a GitHub y a veces devuelve 504
          GP=src/gradle.properties
          touch "$GP"
          for kv in \
            "systemProp.org.gradle.internal.repository.max.retries=10" \
            "systemProp.org.gradle.internal.repository.initial.backoff=2000" \
            "systemProp.org.gradle.internal.http.connectionTimeout=120000" \
            "systemProp.org.gradle.internal.http.socketTimeout=180000"; do
            k="${kv%%=*}"
            grep -q "^${k}=" "$GP" || echo "$kv" >> "$GP"
          done
          cat "$GP" || true

      - name: Compilar
        run: |
          cd src
          chmod +x android.sh
          set -o pipefail
          ok=0
          for intento in 1 2 3; do
            echo "== intento $intento =="
            if ./android.sh ${{ matrix.flags }} ${{ matrix.archs }} --jobs=4; then ok=1; break; fi
            echo "----- build.log (cola) -----"; tail -n 120 build.log || true
            if grep -qiE "504|Gateway Time-out|Could not download|Connection reset|timed out|Read timed out" build.log; then
              echo "Fallo de red, se reintenta en 30s"; sleep 30
            else
              echo "Fallo no relacionado con red, se detiene"; exit 1
            fi
          done
          if [ "$ok" != "1" ]; then echo "el build fallo tras 3 intentos"; exit 1; fi

      - name: Resultado del AAR
        if: always()
        run: |
          echo "### Buscando AAR (${{ matrix.nombre }})" >> $GITHUB_STEP_SUMMARY
          find src/prebuilt -maxdepth 3 \( -name "*.aar" -o -name "*.zip" \) | head -20 >> $GITHUB_STEP_SUMMARY || true
          du -sh src/prebuilt/* 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar-${{ matrix.nombre }}
          path: |
            src/prebuilt/bundle-android-aar-*/
            src/prebuilt/android-*/
            src/build.log
          if-no-files-found: warn
          retention-days: 30

  estado:
    name: estado
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar estado del build
        env:
          RES: ${{ needs.build.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mio=${{ github.run_id }}
          git fetch -q origin main
          git reset --hard -q origin/main
          if [ -f status/latest.json ]; then
            otro=$(sed -n 's/.*"run":"\([0-9]*\)".*/\1/p' status/latest.json)
            if [ -n "$otro" ] && [ "$otro" -gt "$mio" ]; then
              echo "Estado ya pertenece al run $otro (posterior). No se sobrescribe."
              exit 0
            fi
          fi
          mkdir -p status
          printf '{"resultado":"%s","run":"%s","fecha":"%s"}\n' "$RES" "${{ github.run_id }}" "$(date -u +%FT%TZ)" > status/latest.json
          git add status/latest.json
          git commit -m "estado: $RES [skip ci]" || true
          for i in 1 2 3 4; do
            git push && break
            git fetch -q origin main
            git reset --hard -q origin/main
            if [ -f status/latest.json ]; then
              otro=$(sed -n 's/.*"run":"\([0-9]*\)".*/\1/p' status/latest.json)
              if [ -n "$otro" ] && [ "$otro" -gt "$mio" ]; then exit 0; fi
            fi
            printf '{"resultado":"%s","run":"%s","fecha":"%s"}\n' "$RES" "${{ github.run_id }}" "$(date -u +%FT%TZ)" > status/latest.json
            git add status/latest.json
            git commit -m "estado: $RES [skip ci]" || true
            sleep 3
          done